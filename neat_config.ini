[NEAT]
fitness_criterion     = max
fitness_threshold     = 100000
# 30, а не 14: поколение в симуляции стоит ~5 с, поэтому можно содержать
# вдвое больше геномов и получить вдвое больше мутационных попыток за то же
# время. При 14 половина популяции была занята клонами одного вида.
pop_size              = 30
reset_on_extinction   = False
no_fitness_termination = False

[DefaultGenome]
# node activation options
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

# node aggregation options
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# node bias options
# Диапазон ±4, а не ±1: для правила «приседать только на средней птице»
# нужен линейный разделитель с коэффициентом ~2-3 по ttc. При ±1 сеть
# упиралась в предел (30% связей и 26% смещений стояли ровно на ±1.0),
# и присед был физически невыразим.
bias_default            = 0.0
bias_max_value          = 4.0
bias_min_value          = -4.0
bias_mutate_power       = 0.8
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_init_type          = gaussian

genome_type             = default_genome

# node response options
response_default        = 1.0
response_max_value      = 1.0
response_min_value      = -1.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_init_type      = gaussian

# node connection options
# Рост поощряем, удаление сдерживаем: раньше было add=0.5/delete=0.5, то есть
# сеть с равной вероятностью теряла связи, которые только что приобрела —
# структура не могла усложниться. У чемпиона так и осталось 0 скрытых узлов,
# а без них нельзя выразить «присед, если средняя птица И близко» (нужно
# произведение признаков, линейная сеть его не даёт).
conn_add_prob           = 0.6
conn_delete_prob        = 0.2
enabled_default         = True
enabled_mutate_rate     = 0.01

feed_forward            = True
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

num_hidden              = 0
num_inputs              = 8
num_outputs             = 2

weight_default          = 0.0
weight_max_value        = 4.0
weight_min_value        = -4.0
weight_mutate_power     = 0.8
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1
weight_init_mean        = 0.0
# stdev 1.0, а не 2.0: при 2.0 типичная пре-активация выходит за ±2, tanh
# насыщается, и выход залипает в ±1 — ранняя эволюция становится слепой.
weight_init_stdev       = 1.0
weight_init_type        = gaussian

node_add_prob           = 0.4
node_delete_prob        = 0.1
single_structural_mutation = False
structural_mutation_surer   = default
initial_connection        = full

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
# 20, а не 40: вид из 3-4 геномов «не стагнирует» сорок поколений подряд,
# и всё это время популяция топчется на месте. При pop_size 30 стагнация
# наступает реже, поэтому порог можно чуть поднять.
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
# 0.3: при pop_size 30 это ~9 родителей — достаточно, чтобы не свести
# разнообразие к одному чемпиону.
survival_threshold = 0.3
